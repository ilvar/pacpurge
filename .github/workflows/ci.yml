name: CI

# Rust compiles exactly twice: once for the host, where the tests and the
# strict-profile oracle run, and once for x86_64-unknown-linux-musl, which is
# the artefact people actually install. Nothing else compiles.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    container: rust:1.97-bookworm
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Dependency hash for the cargo cache
        id: deps
        run: |
          sed '/^name = "pacpurge"$/,/^$/{/^version = /d;}' Cargo.lock > deps.hashinput
          cat rust-toolchain.toml >> deps.hashinput
          echo "hash=$(sha256sum deps.hashinput | cut -c1-16)" >> "$GITHUB_OUTPUT"
          rm -f deps.hashinput

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry/index/
            /usr/local/cargo/registry/cache/
            /usr/local/cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bookworm-${{ steps.deps.outputs.hash }}
          restore-keys: ${{ runner.os }}-cargo-bookworm-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: test
        run: cargo test --locked

      - name: Week stamp for the strictrs cache
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache strictrs
        uses: actions/cache@v6
        with:
          path: /usr/local/cargo/bin/strictrs
          key: strictrs-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Install strictrs
        run: |
          command -v strictrs >/dev/null \
            || cargo install --git https://github.com/ilvar/strictrs --locked

      - name: strictrs check
        run: strictrs check .

      - name: shellcheck
        run: |
          apt-get update
          apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning scripts/*.sh

  release:
    name: static binary
    runs-on: ubuntu-latest
    container: rust:1.97-bookworm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Add the MUSL target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin pacpurge

      - name: Stage the binary and report its size
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/pacpurge dist/pacpurge
          size=$(stat -c %s dist/pacpurge)
          echo "$size" > dist/size.txt
          echo "pacpurge is $size bytes" >> "$GITHUB_STEP_SUMMARY"

      # The whole point of the MUSL build is that it runs on any Arch box with
      # nothing installed alongside it, so the smoke test drives the real
      # analysis against a synthetic pacman root rather than only printing help.
      - name: Smoke test against a synthetic root
        run: |
          set -eux
          root=$(mktemp -d)
          entry="$root/var/lib/pacman/local/smoke-1.0-1"
          mkdir -p "$entry" "$root/usr/bin"
          printf '%%NAME%%\nsmoke\n\n%%VERSION%%\n1.0-1\n\n%%SIZE%%\n4096\n\n%%REASON%%\n0\n' \
            > "$entry/desc"
          printf '%%FILES%%\nusr/bin/smoke\n' > "$entry/files"
          : > "$root/usr/bin/smoke"

          ./dist/pacpurge --version
          ./dist/pacpurge --help | grep -q -- '--dry-run'
          ./dist/pacpurge --root "$root" --list | grep -q 'smoke'
          ./dist/pacpurge --root "$root" --json | grep -q '"packages": 1'
          ./dist/pacpurge --root "$root" --clean >/dev/null

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: pacpurge-x86_64-musl
          path: dist/
          retention-days: 7
          if-no-files-found: error
