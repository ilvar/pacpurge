[package]
name = "pacpurge"
version = "0.1.1"
edition = "2021"
rust-version = "1.97.1"
description = "A TUI for finding and reclaiming space from unused pacman and AUR packages on Arch Linux"
publish = false

[dependencies]
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
as_conversions = "deny"
wildcard_imports = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
